services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      VOCAB_SIZE: "64"   # 词表大小（词元取值 0..63）
      D_MODEL: "32"      # 注意力维度
      BLOCK_SIZE: "4"    # 每块词元数
      NUM_BLOCKS: "32"   # 物理块总数（容量上限）
      SEED: "1234"       # 固定权重的随机种子
      MAX_QUEUED: "100"  # 追加任务队列的排队上限
      MAX_HISTORY: "200" # 已完成任务在页面/接口中保留的条数
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/stats', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
